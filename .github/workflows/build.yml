name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rafiq Al-Muslim APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Decode permanent signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEY_BASE64}" ]; then
            echo "Error: GitHub Secret SIGNING_KEY_BASE64 is missing or empty."
            exit 1
          fi
          CLEAN_B64=$(printf '%s' "${SIGNING_KEY_BASE64}" | tr -d '[:space:]' | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')
          MOD=$(( ${#CLEAN_B64} % 4 ))
          if [ "$MOD" -eq 2 ]; then
            CLEAN_B64="${CLEAN_B64}=="
          elif [ "$MOD" -eq 3 ]; then
            CLEAN_B64="${CLEAN_B64}="
          fi
          printf '%s' "${CLEAN_B64}" | base64 -d > app/rafiq-key.jks
          if [ ! -s "app/rafiq-key.jks" ]; then
            echo "Error: Failed to decode app/rafiq-key.jks from SIGNING_KEY_BASE64."
            exit 1
          fi
          keytool -list -keystore app/rafiq-key.jks -storepass "${RAFIQ_STORE_PASSWORD:-Rafiq2026!}" -alias "${RAFIQ_KEY_ALIAS:-rafiq}" >/dev/null
          ls -la app/rafiq-key.jks

      - name: Build Signed APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleGithubRelease
          else
            gradle assembleGithubRelease
          fi

      - name: Prepare APK artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/githubRelease -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No signed APK found under app/build/outputs/apk/githubRelease/"
            ls -la app/build/outputs/apk/githubRelease/ || true
            exit 1
          fi
          echo "Found signed APK: $APK_PATH"
          cp "$APK_PATH" rafiq-al-muslim.apk

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "رفيق المسلم - أحدث إصدار"
          files: rafiq-al-muslim.apk
          make_latest: true
          generate_release_notes: true
